    networks:
      roomzin-net:
        ipv4_address: 172.20.0.12
    ports:
      - "7802:7777"
      - "8002:8080"
    volumes:
      - ./data/roomzin-0-2:/opt/roomzin/data
      - ./certs:/opt/roomzin/certs:ro
      - ./configs:/opt/roomzin/configs:ro
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=100M
    cap_add:
