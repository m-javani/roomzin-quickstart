  roomzin-1-1:
    image: mehdyjavany/roomzin:latest
    container_name: roomzin-1-1
    hostname: roomzin-1-1
    networks:
      roomzin-net:
        ipv4_address: 172.20.0.14
    ports:
      - "7811:7777"
      - "8011:8080"
    volumes:
      - ./data/roomzin-1-1:/opt/roomzin/data
      - ./certs:/opt/roomzin/certs:ro
      - ./configs:/opt/roomzin/configs:ro
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=100M
    cap_add:
      - NET_ADMIN
    command: >
      /opt/roomzin/roomzin run-clustered
        --config /opt/roomzin/configs/roomzin.yml
        --codecs /opt/roomzin/configs/codecs.yml
        --node-id roomzin-1-1
        --shard-id shard2
        --zone-id zone2
        --initial-voters roomzin-1-0,roomzin-1-1,roomzin-1-2
        --cert-path /opt/roomzin/certs/cert.pem
        --key-path /opt/roomzin/certs/key.pem
        --ca-cert-path /opt/roomzin/certs/ca.pem
        --rzid-addr rzid:8080
        --rzpoint-addr rzpoint:9090
        --tcp-listen-addr 0.0.0.0
        --api-listen-addr 0.0.0.0
        --quic-listen-addr 0.0.0.0
    depends_on:
      - rzid
      - rzpoint

  roomzin-1-2:
    image: mehdyjavany/roomzin:latest
    container_name: roomzin-1-2
    hostname: roomzin-1-2
    networks:
      roomzin-net:
        ipv4_address: 172.20.0.15
    ports:
      - "7812:7777"
      - "8012:8080"
    volumes:
      - ./data/roomzin-1-2:/opt/roomzin/data
      - ./certs:/opt/roomzin/certs:ro
      - ./configs:/opt/roomzin/configs:ro
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=100M
    cap_add:
      - NET_ADMIN
    command: >
      /opt/roomzin/roomzin run-clustered
        --config /opt/roomzin/configs/roomzin.yml
        --codecs /opt/roomzin/configs/codecs.yml
        --node-id roomzin-1-2
        --shard-id shard2
        --zone-id zone2
        --initial-voters roomzin-1-0,roomzin-1-1,roomzin-1-2
        --cert-path /opt/roomzin/certs/cert.pem
        --key-path /opt/roomzin/certs/key.pem
        --ca-cert-path /opt/roomzin/certs/ca.pem
        --rzid-addr rzid:8080
        --rzpoint-addr rzpoint:9090
        --tcp-listen-addr 0.0.0.0
        --api-listen-addr 0.0.0.0
        --quic-listen-addr 0.0.0.0
    depends_on:
      - rzid
      - rzpoint

  bridge-0:
    image: mehdyjavany/rzbridge:latest
    container_name: bridge-0
    hostname: bridge-0
    networks:
      roomzin-net:
        ipv4_address: 172.20.0.45
    ports:
      - "9000:9000"
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=10M
    command: >
      /opt/rzbridge/rzbridge
        --zone-id zone1
        --shard-id shard1
        --bridge-id bridge-0
        --rzid-addr rzid:8080
        --rzpoint-addr rzpoint:9090
        --listen-host 0.0.0.0
        --listen-port 9000
        --roomzin-api-port 8080
        --roomzin-tcp-port 7777
    depends_on:
      - rzid
      - rzpoint
      - roomzin-0-0
      - roomzin-0-1
      - roomzin-0-2

  bridge-1:
    image: mehdyjavany/rzbridge:latest
    container_name: bridge-1
    hostname: bridge-1
    networks:
      roomzin-net:
        ipv4_address: 172.20.0.46
    ports:
      - "9001:9000"
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=10M
    command: >
      /opt/rzbridge/rzbridge
        --zone-id zone2
        --shard-id shard2
        --bridge-id bridge-1
        --rzid-addr rzid:8080
        --rzpoint-addr rzpoint:9090
        --listen-host 0.0.0.0
        --listen-port 9000
        --roomzin-api-port 8080
        --roomzin-tcp-port 7777
    depends_on:
      - rzid
      - rzpoint
      - roomzin-1-0
      - roomzin-1-1
      - roomzin-1-2

  router-zone-0:
    image: mehdyjavany/rzrouter:latest
    container_name: router-zone-0
    hostname: router-zone-0
    networks:
      roomzin-net:
        ipv4_address: 172.20.0.50
    ports:
      - "9100:9000"
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=10M
    command: >
      /opt/rzrouter/rzrouter
        --mode zone
        --zone-id zone1
        --router-id router-zone-0
        --rzid-addr rzid:8080
        --rzpoint-addr rzpoint:9090
        --listen-host 0.0.0.0
        --tcp-port 9000
        --hop-tcp-port 9000
    depends_on:
      - rzid
      - rzpoint
      - bridge-0

  router-zone-1:
    image: mehdyjavany/rzrouter:latest
    container_name: router-zone-1
    hostname: router-zone-1
    networks:
      roomzin-net:
        ipv4_address: 172.20.0.51
    ports:
      - "9101:9000"
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=10M
    command: >
      /opt/rzrouter/rzrouter
        --mode zone
        --zone-id zone2
        --router-id router-zone-1
        --rzid-addr rzid:8080
        --rzpoint-addr rzpoint:9090
        --listen-host 0.0.0.0
        --tcp-port 9000
        --hop-tcp-port 9000
    depends_on:
      - rzid
      - rzpoint
      - bridge-1

  router-edge:
    image: mehdyjavany/rzrouter:latest
    container_name: router-edge
    hostname: router-edge
    networks:
      roomzin-net:
        ipv4_address: 172.20.0.60
    ports:
      - "9200:9000"
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=10M
    command: >
      /opt/rzrouter/rzrouter
        --mode edge
        --rzid-addr rzid:8080
        --rzpoint-addr rzpoint:9090
        --listen-host 0.0.0.0
        --tcp-port 9000
        --hop-tcp-port 9000
    depends_on:
      - rzid
      - rzpoint
      - router-zone-0
      - router-zone-1

  rzpoint:
    image: python:3.11-slim
    container_name: rzpoint
    hostname: rzpoint
    networks:
      roomzin-net:
        ipv4_address: 172.20.0.40
    ports:
      - "9090:9090"
    working_dir: /opt/rzpoint
    volumes:
      - ./rzpoint-echo.py:/opt/rzpoint/rzpoint-echo.py:ro
    command: python3 /opt/rzpoint/rzpoint-echo.py
    environment:
      - RZPOINT_PORT=9090
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=10M

  rzid:
    image: mehdyjavany/rzid:latest
    container_name: rzid
    hostname: rzid
    networks:
      roomzin-net:
        ipv4_address: 172.20.0.41
    ports:
      - "8081:8080"
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=10M
    command: >
      /opt/rzid/rzid
        --addr 0.0.0.0
        --port 8080
    depends_on:
      - rzpoint

  rzgate:
    image: mehdyjavany/rzgate:latest
    container_name: rzgate
    hostname: rzgate
    networks:
      roomzin-net:
        ipv4_address: 172.20.0.70
    ports:
      - "8777:8777"
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=10M
    command: >
      /opt/rzgate/rzgate
        --mode standalone
        --roomzin-addr router-edge
        --roomzin-port 9000
        --listening-addr 0.0.0.0
        --http-port 8777
        --timeout-sec 2
        --keep-alive-sec 30
        --conn-per-node 10
        --max-active-conns 10000
    depends_on:
      - router-edge

networks:
  roomzin-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
