name: Build Quickstart Package

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build and Upload Quickstart
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Download Roomzin binaries
        run: |
          mkdir -p bin
          curl -L https://github.com/m-javani/roomzin/releases/latest/download/roomzin -o bin/roomzin
          curl -L https://github.com/m-javani/rzbridge/releases/latest/download/rzbridge -o bin/rzbridge
          curl -L https://github.com/m-javani/rzrouter/releases/latest/download/rzrouter -o bin/rzrouter
          curl -L https://github.com/m-javani/rzid/releases/latest/download/rzid -o bin/rzid
          curl -L https://github.com/m-javani/rzproxy/releases/latest/download/rzproxy -o bin/rzproxy
          chmod +x bin/*

      - name: Prepare package
        run: |
          PACKAGE_NAME="roomzin-quickstart"
          mkdir -p ${PACKAGE_NAME}
          
          # Copy files
          cp -r configs ${PACKAGE_NAME}/
          cp -r certs ${PACKAGE_NAME}/
          cp -r bin ${PACKAGE_NAME}/
          cp Makefile ${PACKAGE_NAME}/
          cp quick-start.py ${PACKAGE_NAME}/
          cp gen_data.py ${PACKAGE_NAME}/
          cp rzpoint-echo.py ${PACKAGE_NAME}/
          cp build.sh ${PACKAGE_NAME}/
          cp quick-start.txt ${PACKAGE_NAME}/
          
          # Create sample-queries directory
          mkdir -p ${PACKAGE_NAME}/sample-queries
          
          # Create tarball
          tar -czf ${PACKAGE_NAME}.tar.gz ${PACKAGE_NAME}/

      - name: Upload to release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: latest
          name: Latest Build
          files: roomzin-quickstart.tar.gz
          prerelease: true
          draft: false
          generate_release_notes: false